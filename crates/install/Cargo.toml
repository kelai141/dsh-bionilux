[package]
name = "bionilux-install"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "bionilux release manifest, asset download/verification, safe extraction and install transaction"

[dependencies]
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tar = "0.4.46"
ureq = { version = "2.12", default-features = true }
