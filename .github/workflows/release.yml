name: Draft release
run-name: Draft ${{ inputs.tag }} (${{ inputs.source_ref || github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag matching both plugin package versions (for example v0.5.0)
        required: true
        type: string
      source_ref:
        description: Source branch, tag or SHA (empty uses the selected workflow commit)
        type: string
        default: ''
      notes:
        description: Release notes content; CLI supports -F notes=@notes.md
        type: string
        default: ''
      notes_file:
        description: Repository-relative notes file used when notes is empty
        type: string
        default: notes.md

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: validate release identity and notes
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and exact source commit
        id: identity
        env:
          BUILD_TAG: ${{ inputs.tag }}
        run: python3 scripts/release_metadata.py identity --release --output BUILD_INFO.json
      - name: Resolve notes.md without evaluating its contents
        env:
          NOTES_CONTENT: ${{ inputs.notes }}
          NOTES_FILE: ${{ inputs.notes_file }}
        run: python3 scripts/release_metadata.py notes --output resolved-notes.md
      - name: Refuse an existing release or a tag pointing at another commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release already exists; drafts and public releases are never overwritten." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA" || {
              echo "Existing tag does not point at the selected source commit." >&2
              exit 1
            }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: draft-request
          path: |
            BUILD_INFO.json
            resolved-notes.md
          retention-days: 7

  build:
    name: build verified ARM64 and x86_64 assets
    needs: prepare
    uses: ./.github/workflows/debug-build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read

  publish:
    name: create draft release only
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: target/release-assets
      - uses: actions/download-artifact@v4
        with:
          name: draft-request
          path: target/draft-request
      - name: Recheck asset checksums and source identity
        run: |
          set -euo pipefail
          test -s target/draft-request/resolved-notes.md
          cmp target/draft-request/BUILD_INFO.json target/release-assets/BUILD_INFO.json
          cd target/release-assets
          sha256sum --check --strict SHA256SUMS
      - name: Create draft with the supplied notes and both architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Recheck after the build; a tag may have appeared or moved meanwhile.
          # Draft visibility requires push access; this check runs with the
          # publish job's contents:write token, not the read-only build token.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Release or draft already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2> "$RUNNER_TEMP/tag-error"); then
            test "$tag_sha" = "$SOURCE_SHA" || { echo 'Tag source changed during build.' >&2; exit 1; }
          elif ! grep -F 'HTTP 404' "$RUNNER_TEMP/tag-error" > /dev/null; then
            cat "$RUNNER_TEMP/tag-error" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" target/release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Linux runtime $RELEASE_TAG" \
            --draft \
            --notes-file target/draft-request/resolved-notes.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,url --jq 'if .isDraft then .url else error("Release is not a draft") end' \
            >> "$GITHUB_STEP_SUMMARY"
