name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --verbose
      - name: native launcher Make and interactive regressions
        run: |
          cargo build --locked
          BIONILUX_TEST_LAUNCHER="$PWD/target/debug/bionilux" bash tests/make.sh
          BIONILUX_TEST_LAUNCHER="$PWD/target/debug/bionilux" bash tests/runtime.sh
          bash tests/identity_compat.sh
          bash tests/syscall_compat.sh
          bash tests/python_compat.sh
          bash tests/glob_compat.sh
          bash tests/host_paths.sh
          bash tests/sharedlib.sh
          bash tests/prepare_rootfs.sh

      # The whole point of this fork is that no host package path is baked in.
      # A guest prefix is derived from the host application's package name,
      # which is not Termux', so this must never reappear in src/.
      - name: no hardcoded Termux paths
        run: |
          if grep -rn "com\.termux" src/; then
            echo "::error::hardcoded Termux path found in src/"
            exit 1
          fi

  linux-environment-plugins:
    # The two experimental plugin packages and the release manifest validator are
    # pure Node.js; they are gated on every PR so the install/update contract
    # (checksums, opt-in activation, shared Node reuse) cannot regress.
    name: linux environment plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: plugin package tests
        run: node --test packages/linux-bootstrap/test/*.test.mjs packages/linux-runtime/test/*.test.mjs
      - name: the bootstrap and runtime manifest validators agree
        run: |
          node --input-type=module -e '
            import { validateManifest } from "./packages/linux-runtime/modules/manifest.js";
            import { validateManifestShape } from "./packages/linux-bootstrap/src/manifest.js";
            const tag = "v0.5.0";
            const asset = (name) => ({
              url: `https://github.com/kelai141/dsh-bionilux/releases/download/${tag}/${name}`,
              sha256: "a".repeat(64),
              size: 1,
              unpackedSize: 1,
              pluginReleaseUrl: `https://github.com/kelai141/dsh-bionilux/releases/tag/${tag}`,
            });
            const manifest = {
              schemaVersion: 1,
              version: "0.5.0",
              minMobileVersion: "0.14.0",
              plugins: { bootstrap: asset("linux-bootstrap-plugin.tar.xz"), runtime: asset("linux-runtime-plugin.tar.xz") },
              runtimes: [{
                id: "debian-minimal",
                label: "Debian minimal",
                architecture: "arm64",
                backend: "bionilux",
                backendAsset: asset("bionilux-backend-aarch64.tar.xz"),
                rootfsAsset: asset("debian-minimal-aarch64.tar.xz"),
                nodeAsset: asset("node-glibc-v24.22.0-linux-arm64.tar.xz"),
              }],
            };
            validateManifest(manifest);
            validateManifestShape(manifest, tag);
            console.log("Both manifest validators accept the canonical release manifest.");
          '
      - name: no tracked release binaries or Git LFS pointers
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          forbidden_suffixes = (
              ".so", ".dylib", ".dll", ".exe", ".apk", ".deb", ".tar",
              ".tar.gz", ".tar.xz", ".tgz", ".xz", ".a", ".o", ".node",
          )
          lfs_pointer = b"version https://git-lfs.github.com/spec/v1\n"
          errors = []
          for raw_path in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw_path:
                  continue
              path = os.fsdecode(raw_path)
              if path.lower().endswith(forbidden_suffixes):
                  errors.append(f"tracked release/binary asset: {path}")
              try:
                  with open(path, "rb") as tracked_file:
                      prefix = tracked_file.read(1024)
              except (OSError, IsADirectoryError):
                  continue
              if prefix.startswith(lfs_pointer):
                  errors.append(f"tracked Git LFS pointer: {path}")
              if os.path.basename(path) == ".gitattributes" and re.search(r"(?im)^\s*[^#\n]*\bfilter\s*=\s*lfs\b", prefix.decode("utf-8", errors="replace")):
                  errors.append(f"Git LFS tracking rule in {path}")
          if errors:
              print("::error::Release binaries and generated archives belong in GitHub Releases, not Git/LFS.")
              print("\n".join(errors))
              sys.exit(1)
          print("No tracked release binaries, generated archives, or Git LFS pointers.")
          PY

  preload-paths:
    name: preload path semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run hook path tests
        run: |
          bash tests/preload_paths.sh
          bash tests/runtime.sh
          bash tests/ubsan.sh
          bash tests/make.sh
          bash tests/prepare_rootfs.sh

      - name: shellcheck (if available)
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck -S warning tests/*.sh scripts/*.sh setup || true
          fi

  preload:
    name: preload (aarch64-glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user

      - name: build
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -O2 \
            -o libbionilux_preload.so \
            src/preload/hooks.c -pthread -ldl \
            -Wl,--dynamic-linker=/lib/ld-linux-aarch64.so.1 \
            -Wl,-rpath,/usr/lib/aarch64-linux-gnu

      - name: AArch64 glibc QEMU regressions (not Android)
        run: bash tests/aarch64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: preload
          path: libbionilux_preload.so

  bionilux:
    name: bionilux (aarch64-bionic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27

      - name: build
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TC/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/bin/llvm-ar"
          cargo build --release --locked --target aarch64-linux-android
          cp target/aarch64-linux-android/release/bionilux .

      - uses: actions/upload-artifact@v4
        with:
          name: bionilux
          path: bionilux

  box64:
    name: box64-glibc
    runs-on: ubuntu-24.04-arm
    steps:
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential python3

      - name: clone and build
        run: |
          git clone --depth 1 https://github.com/ptitSeb/box64 /tmp/box64
          cd /tmp/box64
          mkdir build && cd build
          cmake .. -DARM64=1 -DCMAKE_BUILD_TYPE=RelWithDebInfo
          make -j"$(nproc)"
          strip box64
          cp box64 "$GITHUB_WORKSPACE/box64-glibc"

      - uses: actions/upload-artifact@v4
        with:
          name: box64
          path: box64-glibc

  x86-libs:
    name: x86_64 runtime libs
    runs-on: ubuntu-latest
    steps:
      - name: fetch ubuntu 26.04 base rootfs (amd64)
        run: |
          set -eux
          curl -fLO https://cdimage.ubuntu.com/ubuntu-base/resolute/daily/current/resolute-base-amd64.tar.gz
          mkdir rootfs
          tar -xzf resolute-base-amd64.tar.gz -C rootfs

      - name: package
        run: |
          set -eux
          mkdir -p out/x86_64-linux-gnu
          cp -a rootfs/lib/x86_64-linux-gnu/. out/x86_64-linux-gnu/
          if [ -d rootfs/usr/lib/x86_64-linux-gnu ]; then
            cp -an rootfs/usr/lib/x86_64-linux-gnu/. out/x86_64-linux-gnu/
          fi
          cd out
          tar -cJf ../x86_64-libs.tar.xz x86_64-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-libs
          path: x86_64-libs.tar.xz

  release:
    name: release
    needs: [test, preload-paths, preload, bionilux, box64, x86-libs]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out/

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
