name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_legacy_artifacts:
        description: Build legacy setup artifacts (not used by the modern release)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-workflows:
    name: release workflow contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release metadata, manifest and ELF positive/negative tests
        run: |
          python3 tests/test_release_workflows.py -v
          python3 tests/test_elf_alignment.py -v
          python3 tests/test_ci_packages.py -v
      - name: Validate Actions syntax with pinned actionlint
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 300s curl --fail --location --connect-timeout 15 --max-time 120 --retry 2 --retry-max-time 240 --retry-all-errors \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yml

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --verbose
      - name: native launcher Make and interactive regressions
        run: |
          cargo build --locked
          BIONILUX_TEST_LAUNCHER="$PWD/target/debug/bionilux" bash tests/make.sh
          BIONILUX_TEST_LAUNCHER="$PWD/target/debug/bionilux" bash tests/runtime.sh
          bash tests/identity_compat.sh
          bash tests/syscall_compat.sh
          bash tests/python_compat.sh
          bash tests/glob_compat.sh
          bash tests/host_paths.sh
          bash tests/sharedlib.sh
          bash tests/prepare_rootfs.sh

      # The whole point of this fork is that no host package path is baked in.
      # A guest prefix is derived from the host application's package name,
      # which is not Termux', so this must never reappear in src/.
      - name: no hardcoded Termux paths
        run: |
          if grep -rn "com\.termux" src/; then
            echo "::error::hardcoded Termux path found in src/"
            exit 1
          fi

  preload-paths:
    name: preload path semantics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: run hook path tests
        run: |
          bash tests/preload_paths.sh
          bash tests/runtime.sh
          bash tests/ubsan.sh
          bash tests/make.sh
          bash tests/prepare_rootfs.sh

      - name: shellcheck (if available)
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck -S warning tests/*.sh scripts/*.sh setup || true
          fi

  preload:
    name: preload (aarch64-glibc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install cross toolchain
        timeout-minutes: 18
        run: |
          bash scripts/ci-install-packages.sh gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - name: build
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -O2 \
            -o libbionilux_preload.so \
            src/preload/hooks.c -pthread -ldl \
            -Wl,--dynamic-linker=/lib/ld-linux-aarch64.so.1 \
            -Wl,-rpath,/usr/lib/aarch64-linux-gnu -Wl,-z,max-page-size=16384
          python3 scripts/check_elf_alignment.py --policy android --machine aarch64 libbionilux_preload.so

      - name: AArch64 glibc QEMU regressions (not Android)
        run: bash tests/aarch64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: preload
          path: libbionilux_preload.so

  bionilux:
    name: bionilux (aarch64-bionic)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27

      - name: build
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TC/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/bin/llvm-ar"
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --release --locked --target aarch64-linux-android
          python3 scripts/check_elf_alignment.py --policy android --machine aarch64 target/aarch64-linux-android/release/bionilux
          cp target/aarch64-linux-android/release/bionilux .

      - uses: actions/upload-artifact@v4
        with:
          name: bionilux
          path: bionilux

  box64:
    # Legacy setup artifacts are opt-in, never substitutes for modern release gates.
    if: github.event_name == 'workflow_dispatch' && inputs.build_legacy_artifacts
    name: box64-glibc
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        timeout-minutes: 18
        run: |
          bash scripts/ci-install-packages.sh git cmake build-essential python3

      - name: clone and build
        run: |
          timeout --signal=TERM --kill-after=15s 300s git -c http.connectTimeout=15 -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=60 clone --depth 1 https://github.com/ptitSeb/box64 /tmp/box64
          cd /tmp/box64
          mkdir build && cd build
          cmake .. -DARM64=1 -DCMAKE_BUILD_TYPE=RelWithDebInfo
          make -j"$(nproc)"
          strip box64
          cp box64 "$GITHUB_WORKSPACE/box64-glibc"

      - uses: actions/upload-artifact@v4
        with:
          name: box64
          path: box64-glibc

  x86-libs:
    # Legacy setup artifacts are opt-in, never substitutes for modern release gates.
    if: github.event_name == 'workflow_dispatch' && inputs.build_legacy_artifacts
    name: x86_64 runtime libs
    runs-on: ubuntu-24.04
    steps:
      - name: fetch ubuntu 26.04 base rootfs (amd64)
        run: |
          set -eux
          timeout --signal=TERM --kill-after=15s 300s curl --fail --location --remote-name --connect-timeout 15 --max-time 120 --retry 2 --retry-max-time 240 --retry-all-errors https://cdimage.ubuntu.com/ubuntu-base/resolute/daily/current/resolute-base-amd64.tar.gz
          mkdir rootfs
          tar -xzf resolute-base-amd64.tar.gz -C rootfs

      - name: package
        run: |
          set -eux
          mkdir -p out/x86_64-linux-gnu
          cp -a rootfs/lib/x86_64-linux-gnu/. out/x86_64-linux-gnu/
          if [ -d rootfs/usr/lib/x86_64-linux-gnu ]; then
            cp -an rootfs/usr/lib/x86_64-linux-gnu/. out/x86_64-linux-gnu/
          fi
          cd out
          tar -cJf ../x86_64-libs.tar.xz x86_64-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-libs
          path: x86_64-libs.tar.xz
