name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── test: runs on every push/PR ────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --verbose

  # ── preload: aarch64 glibc shared library ──────────────────────
  preload:
    name: preload (aarch64-glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: build
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -O2 \
            -o libbionilux_preload.so \
            src/preload/hooks.c \
            -Wl,--dynamic-linker=/lib/ld-linux-aarch64.so.1 \
            -Wl,-rpath,/usr/lib/aarch64-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: preload
          path: libbionilux_preload.so

  # ── bionilux: rust binary for android bionic ───────────────────
  bionilux:
    name: bionilux (aarch64-bionic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27

      - name: build
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TC/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/bin/llvm-ar"
          cargo build --release --locked --target aarch64-linux-android
          cp target/aarch64-linux-android/release/bionilux .

      - uses: actions/upload-artifact@v4
        with:
          name: bionilux
          path: bionilux

  # ── box64: native ARM64 runner ─────────────────────────────────
  box64:
    name: box64-glibc
    runs-on: ubuntu-24.04-arm
    steps:
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential python3

      - name: clone and build
        run: |
          git clone --depth 1 --branch v0.4.5 \
            https://github.com/ptitSeb/box64 /tmp/box64
          cd /tmp/box64
          mkdir build && cd build
          cmake .. -DARM64=1 -DCMAKE_BUILD_TYPE=RelWithDebInfo
          make -j"$(nproc)"
          strip box64
          cp box64 "$GITHUB_WORKSPACE/box64-glibc"

      - uses: actions/upload-artifact@v4
        with:
          name: box64
          path: box64-glibc

  # ── x86_64 runtime libs from debian trixie ─────────────────────
  x86-libs:
    name: x86_64 runtime libs
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: install dpkg tools
        run: |
          apt-get update
          apt-get install -y dpkg-dev xz-utils

      - name: download packages
        run: |
          set -eux
          mkdir -p root && cd root
          apt-get download \
            libc6 libgcc-s1 libstdc++6 \
            zlib1g libbz2-1.0 liblzma5 libzstd1 \
            libssl3t64 libcrypt1 \
            libbsd0 libmd0 \
            libtinfo6 libncurses6 libncursesw6 \
            libgpg-error0 libgcrypt20 libgmp10 \
            libpcre2-8-0 libseccomp2 libselinux1 \
            libuuid1 libblkid1 libmount1 \
            libsystemd0 libudev1 \
            libacl1 libattr1 libcap-ng0 \
            libcom-err2 libext2fs2 libss2 libe2p2 \
            libaudit1 libpam0g \
            libnsl2 libtirpc3 \
            libkeyutils1 libkrb5-3 libk5crypto3 libkrb5support0 \
            libidn2-0 libunistring5 libffi8 \
            libcbor0.10 libfido2-1
          for d in *.deb; do dpkg-deb -x "$d" .; done
          rm -f *.deb

      - name: package
        run: |
          cd root
          tar -cJf ../x86_64-libs.tar.xz \
            lib/x86_64-linux-gnu \
            usr/lib/x86_64-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: x86_64-libs
          path: x86_64-libs.tar.xz

  # ── release: only on tag push ──────────────────────────────────
  release:
    name: release
    needs: [preload, bionilux, box64, x86-libs]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out/

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false